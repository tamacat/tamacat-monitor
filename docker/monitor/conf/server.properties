ServerName=tamacat-httpd
# 8080 (unprivileged): no sysctl needed for UID 65532, and the published host port is the same
# number. tamacat-httpd 1.7 rewrites the Host header wrongly when the client-side port differs
# from this port (e.g. "127.0.0.1:8080:18090"), so publish it as <host>:8080:8080.
Port=8080

### HTTPS (terminate TLS at a load balancer, or configure a keystore here)
https=false

### HttpEngine/ServerConfig
MaxServerThreads=50
ServerSocketTimeout=30000
ConnectionTimeout=30000
ServerSocketBufferSize=8192

### KeepAliveConnReuseStrategy
KeepAliveTimeout=0
KeepAliveRequests=0

### WorkerThread
WorkerThreadName=http-8080

### ReverseProxyHandler
BackEndSocketTimeout=15000
BackEndConnectionTimeout=5000
BackEndSocketBufferSize=8192

### Configuration files
url-config.file=url-config.xml
components.file=components.xml
