# tamacat-logging configuration (stdout only). https://github.com/tamacat/tamacat-logging
# TAMACAT_LOG_FORMAT=json switches to ECS JSON Lines.
format=text
pattern=%d [%thread] [%level] %logger{40} - %msg%labels%n%ex

level.root=WARN
level.Access=INFO
level.org.tamacat=INFO
level.org.tamacat.monitor=INFO
# SQL: failures and slow queries are WARN; DEBUG logs every statement (SQL text only, never values)
level.org.tamacat.sql.SQL=WARN
level.org=INFO
level.com=INFO

# never print these keys in structured log fields
mask.keys=password,secret,token,authorization,cookie
